<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#08080b; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161020" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0c0c12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8055d8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="supportGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2256"/>
      <stop offset="100%" stop-color="#692d77"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGlow)"/>

  <!-- Left Sidebar (width 200) -->
  <rect x="0" y="0" width="200" height="600" fill="#0c0c10" stroke="#1e1e28" stroke-width="1"/>
  
  <!-- Brand -->
  <rect x="20" y="24" width="28" height="28" rx="8" fill="#231b35" stroke="#49336c"/>
  <path d="M 26 38 L 30 38 L 33 30 L 36 44 L 39 35 L 42 38 L 44 38" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="43" fill="#f5f5f7" font-size="18" font-weight="800">life<tspan fill="#a78bfa">os</tspan></text>
  <text x="160" y="43" fill="#696975" font-size="10">v0.1.0</text>

  <!-- Nav Section Label -->
  <text x="20" y="80" fill="#777783" font-size="9" font-weight="700" letter-spacing="1.2">МОЙ КОМПЬЮТЕР</text>

  <!-- Nav Items -->
  <g transform="translate(14, 95)">
    <!-- Active Item: Overview -->
    <rect x="0" y="0" width="172" height="34" rx="7" fill="#1b1724"/>
    <rect x="0" y="6" width="3" height="22" rx="1.5" fill="#8055d8"/>
    <text x="32" y="22" fill="#e8e1f4" font-size="12" font-weight="600">Обзор</text>
    
    <text x="32" y="56" fill="#94949f" font-size="12">Активность</text>
    <text x="32" y="90" fill="#94949f" font-size="12">Приложения</text>
    <text x="32" y="124" fill="#94949f" font-size="12">Характеристики ПК</text>
    <text x="32" y="158" fill="#94949f" font-size="12">Клавиатура и мышь</text>
    <text x="32" y="192" fill="#94949f" font-size="12">Активность Firefox</text>
    <text x="32" y="226" fill="#94949f" font-size="12">Буфер обмена</text>
    <text x="32" y="260" fill="#94949f" font-size="12">Достижения</text>
    <text x="32" y="294" fill="#94949f" font-size="12">Настройки</text>
  </g>

  <!-- Sidebar Bottom / Author Card -->
  <g transform="translate(14, 465)">
    <rect x="0" y="0" width="172" height="115" rx="9" fill="#14111d" stroke="#2a2237" stroke-width="1"/>
    <!-- Privacy note -->
    <circle cx="18" cy="20" r="4" fill="#a78bfa"/>
    <text x="28" y="23" fill="#8b8796" font-size="9">Локальная база данных</text>

    <!-- Author Badge -->
    <text x="14" y="52" fill="#8b8796" font-size="9">Сделано разработчиком:</text>
    <text x="14" y="70" fill="#e2b4f5" font-size="13" font-weight="700">Hikkanilo &lt;3</text>
    
    <!-- Support Button -->
    <rect x="12" y="80" width="148" height="26" rx="6" fill="url(#supportGrad)" stroke="#794b85"/>
    <text x="86" y="97" fill="#ffd8ec" font-size="10" font-weight="600" text-anchor="middle">❤ Поддержать автора</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(230, 24)">
    <!-- Header -->
    <text x="0" y="12" fill="#777783" font-size="10" font-weight="700" letter-spacing="1.2">LIFEOS · ЛИЧНЫЙ ЖУРНАЛ</text>
    <text x="0" y="38" fill="#f5f5f7" font-size="22" font-weight="700">Обзор компьютера</text>
    <text x="0" y="56" fill="#92929d" font-size="11">Только данные с этого устройства · Локальный SQLite</text>

    <!-- Top Right Controls -->
    <g transform="translate(540, 16)">
      <!-- Corner Support Button -->
      <rect x="0" y="0" width="105" height="28" rx="7" fill="url(#supportGrad)" stroke="#8f4ba5"/>
      <text x="52" y="18" fill="#fce4f4" font-size="11" font-weight="600" text-anchor="middle">❤ Поддержать</text>

      <!-- Status dot -->
      <circle cx="125" cy="14" r="3.5" fill="#a78bfa"/>
      <text x="135" y="18" fill="#a78bfa" font-size="11" font-weight="500">Запись статистики</text>

      <!-- Refresh btn -->
      <rect x="190" y="0" width="28" height="28" rx="6" fill="#101015" stroke="#292832"/>
      <text x="204" y="18" fill="#9695a0" font-size="12" text-anchor="middle">↻</text>
    </g>

    <!-- Hero Card -->
    <g transform="translate(0, 75)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="730" height="150" rx="12" fill="#15131b" stroke="#292533"/>
      <text x="24" y="26" fill="#777783" font-size="9" font-weight="700" letter-spacing="1">КОМПЬЮТЕР РАБОТАЕТ</text>
      <text x="24" y="65" fill="#f5f5f7" font-size="32" font-weight="700">6 ч 42 мин</text>
      <text x="24" y="90" fill="#92929d" font-size="11">Windows запущена сегодня · сейчас активно: <tspan fill="#d8c2ff" font-weight="600">Visual Studio Code</tspan></text>
      
      <!-- Progress Bar -->
      <rect x="24" y="106" width="460" height="5" rx="2.5" fill="#2b2932"/>
      <rect x="24" y="106" width="310" height="5" rx="2.5" fill="url(#purpleGrad)"/>
      <text x="24" y="126" fill="#777783" font-size="9">Активное время сегодня: 4 ч 18 мин</text>
      <text x="410" y="126" fill="#b59cf0" font-size="9">Мониторинг активен</text>

      <!-- Focus card inside hero -->
      <rect x="520" y="18" width="190" height="114" rx="9" fill="#1b1725" stroke="#4a3a5b"/>
      <text x="536" y="38" fill="#777783" font-size="8" font-weight="700">ТОП ПРИЛОЖЕНИЕ</text>
      <text x="536" y="62" fill="#f5f5f7" font-size="14" font-weight="700">Visual Studio Code</text>
      <text x="536" y="80" fill="#a8a1b5" font-size="10">2 ч 35 мин активности</text>
      <text x="536" y="112" fill="#cbb6f2" font-size="10">Все приложения →</text>
    </g>

    <!-- Three Metrics -->
    <g transform="translate(0, 240)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="232" height="95" rx="9" fill="#101015" stroke="#24242e"/>
      <text x="16" y="24" fill="#9595a0" font-size="10">Время в Windows</text>
      <text x="16" y="58" fill="#f5f5f7" font-size="20" font-weight="700">6 ч 42 мин</text>
      <text x="16" y="80" fill="#70707b" font-size="9">Загрузка: сегодня 08:15</text>

      <!-- Metric 2 -->
      <rect x="249" y="0" width="232" height="95" rx="9" fill="#101015" stroke="#24242e"/>
      <text x="265" y="24" fill="#9595a0" font-size="10">Активное время сегодня</text>
      <text x="265" y="58" fill="#f5f5f7" font-size="20" font-weight="700">4 ч 18 мин</text>
      <text x="265" y="80" fill="#70707b" font-size="9">AFK: 2 ч 24 мин</text>

      <!-- Metric 3 -->
      <rect x="498" y="0" width="232" height="95" rx="9" fill="#101015" stroke="#24242e"/>
      <text x="514" y="24" fill="#9595a0" font-size="10">Нажатия и клики сегодня</text>
      <text x="514" y="58" fill="#f5f5f7" font-size="20" font-weight="700">14 280 · 3 410</text>
      <text x="514" y="80" fill="#70707b" font-size="9">Сохраняются только количества</text>
    </g>

    <!-- Bottom Panels -->
    <g transform="translate(0, 350)">
      <!-- Panel 1: Apps -->
      <rect x="0" y="0" width="450" height="185" rx="9" fill="#101015" stroke="#24242e"/>
      <text x="18" y="26" fill="#f5f5f7" font-size="13" font-weight="600">Чем пользовался сегодня</text>
      <text x="18" y="42" fill="#777783" font-size="9">Время по активным окнам</text>

      <!-- App rows -->
      <g transform="translate(18, 55)">
        <text x="0" y="16" fill="#f5f5f7" font-size="11" font-weight="600">Visual Studio Code</text>
        <text x="320" y="16" fill="#b6a5d8" font-size="10">2 ч 35 мин</text>
        <rect x="0" y="22" width="414" height="3" rx="1.5" fill="#282631"/>
        <rect x="0" y="22" width="280" height="3" rx="1.5" fill="#8055d8"/>

        <text x="0" y="46" fill="#f5f5f7" font-size="11" font-weight="600">Firefox</text>
        <text x="320" y="46" fill="#b6a5d8" font-size="10">1 ч 12 мин</text>
        <rect x="0" y="52" width="414" height="3" rx="1.5" fill="#282631"/>
        <rect x="0" y="52" width="130" height="3" rx="1.5" fill="#8055d8"/>

        <text x="0" y="76" fill="#f5f5f7" font-size="11" font-weight="600">Telegram</text>
        <text x="320" y="76" fill="#b6a5d8" font-size="10">31 мин</text>
        <rect x="0" y="82" width="414" height="3" rx="1.5" fill="#282631"/>
        <rect x="0" y="82" width="55" height="3" rx="1.5" fill="#8055d8"/>
      </g>

      <!-- Panel 2: Hardware / System -->
      <rect x="466" y="0" width="264" height="185" rx="9" fill="#101015" stroke="#24242e"/>
      <text x="484" y="26" fill="#f5f5f7" font-size="13" font-weight="600">Характеристики ПК</text>
      <text x="484" y="42" fill="#777783" font-size="9">Локальные датчики</text>

      <g transform="translate(484, 60)">
        <text x="0" y="14" fill="#898692" font-size="9">ПРОЦЕССОР</text>
        <text x="0" y="30" fill="#f5f5f7" font-size="11" font-weight="600">AMD / Intel CPU</text>
        
        <text x="0" y="54" fill="#898692" font-size="9">ОПЕРАТИВНАЯ ПАМЯТЬ</text>
        <text x="0" y="70" fill="#f5f5f7" font-size="11" font-weight="600">16 ГБ / 32 ГБ</text>

        <text x="0" y="94" fill="#898692" font-size="9">ТЕМПЕРАТУРА</text>
        <text x="0" y="110" fill="#76cda5" font-size="12" font-weight="700">46°C · В норме</text>
      </g>
    </g>

    <!-- Footer -->
    <g transform="translate(0, 550)">
      <line x1="0" y1="0" x2="730" y2="0" stroke="#202029" stroke-width="1"/>
      <text x="0" y="16" fill="#8b8796" font-size="10">LifeOS · Сделано разработчиком <tspan fill="#bfa6e6" font-weight="700">Hikkanilo &lt;3</tspan></text>
      <text x="530" y="16" fill="#d19ec6" font-size="10" font-weight="600">❤ boosty.to/montonmef</text>
    </g>
  </g>
</svg>